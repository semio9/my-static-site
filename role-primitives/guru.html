<!doctype html>
<html lang="en">

<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg">

  <meta charset="utf-8">
  <title>Ur-Roles — Symbol Layer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://symbollayer.com/ur-roles">
  <meta name="author" content="shk">
  <meta name="description" content="Ur-Roles within the Symbol Layer framework. Foundational human roles that resist full specification due to their archetypal, liminal, and ethereal complexity.">
  <meta name="canonical-name" content="ur-roles">
  <meta name="license" content="CC0 1.0 (Public Domain)">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    :root {
      --ink:#1b1f23;
      --muted:#6a737d;
      --rule:#e1e4e8;
      --bg:#ffffff;
      --accent:#0B7F8E;
      --soft:#f6f8fa;
      --note:#fffdf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 2.5rem auto;
      max-width: 860px;
      padding: 0 1.2rem 3rem;
      font: 16px/1.65 Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--bg);
    }
    h1, h2, h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
    }
    h1 { font-size: 2rem; margin: 1.8rem 0 0.6rem; line-height: 1.25; }
    p { margin: 0.9rem 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; color: #138b8f; }
    .rule { border-top: 1px solid var(--rule); margin: 1rem 0; }
    footer {
      border-top: 1px solid var(--rule);
      margin-top: 2rem;
      padding-top: 1rem;
      color: var(--muted);
      font-size: .9rem;
    }
    nav a { color: var(--accent); text-decoration: none; margin: 0 .25rem; }
